<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102423"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FitStart"><meta name="description" content="Dein privater Offline-Trainingsbegleiter für Muskelaufbau."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><title>FitStart 2.0 – Muskelaufbau</title>
<style>
:root{color-scheme:dark;--bg:#0c1718;--panel:#152527;--panel2:#1d3132;--line:#324544;--txt:#f0f8f4;--muted:#a3b9b2;--green:#9cf5b8;--accent:#66daa3;--dark:#08251a;--orange:#f5bf76}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top right,#203d36,#0c1718 42%);color:var(--txt)}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}.app{max-width:620px;margin:auto;min-height:100svh;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 10px}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--green);color:var(--dark);font-size:25px;font-weight:900}.brand strong{display:block;font-size:18px}.tag,.muted{color:var(--muted)}.tag{font-size:11px}.pill{font-size:12px;color:var(--green);background:#183e32;padding:6px 11px;border-radius:999px}.hero{background:linear-gradient(140deg,#275944,#17372f);padding:24px;border:1px solid #44745b;border-radius:24px;margin:16px 0}.hero h1{font-size:29px;line-height:1.13;letter-spacing:-.8px;margin:10px 0}.hero p{margin:0;color:#c9e6d7}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px 10px;border-radius:17px;background:var(--panel);border:1px solid var(--line)}.stat strong{display:block;font-size:24px}.stat small{font-size:11px;color:var(--muted)}h2{font-size:20px;letter-spacing:-.3px;margin:26px 0 12px}h3{font-size:16px;margin:0 0 5px}.card{border:1px solid var(--line);border-radius:19px;background:var(--panel);padding:17px;margin:10px 0}.card p{margin:6px 0}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:800;background:var(--green);color:var(--dark);min-height:46px}.btn.secondary{background:#29423e;color:var(--txt);border:1px solid #44635a}.btn.ghost{background:transparent;color:var(--green);border:1px solid #486b5c}.btn.warn{background:#493126;color:#ffd6af}.btn.small{font-size:12px;min-height:36px;padding:8px 11px}.wide{width:100%}.row{display:flex;gap:9px;align-items:center}.wrap{flex-wrap:wrap}.tip{font-size:13px;color:var(--muted);line-height:1.5}.exercise{margin-bottom:12px}.exercise-title{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.exercise-title small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.set-head,.set-row{display:grid;grid-template-columns:43px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}.set-head{font-size:11px;color:var(--muted);margin:15px 0 6px;text-align:center}.set-row{margin:9px 0}.set-row .num{font-weight:800;text-align:center}.field{width:100%;min-width:0;border:1px solid #527268;border-radius:10px;background:#0f2021;color:white;padding:12px 7px;text-align:center;font-size:16px}.check{width:40px;height:40px;border-radius:11px;border:1px solid #638679;background:#1d3b32;color:var(--green);font-size:21px}.check.on{background:var(--green);color:var(--dark)}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#112122f2;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:30}.nav-inner{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:620px}.nav button{border:0;background:none;color:var(--muted);padding:6px 2px;border-radius:10px;font-size:11px}.nav button.active{background:#24453a;color:var(--green)}.nav span{display:block;font-size:21px}.timer{position:sticky;top:6px;z-index:5;background:#1e4436;border:1px solid #5a9a73;border-radius:15px;padding:10px 13px;margin:10px 0;box-shadow:0 6px 30px #0008}.timer strong{font-size:22px;font-variant-numeric:tabular-nums}.line{height:1px;background:var(--line);margin:13px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:12px 14px;border-radius:13px;background:#393126;border:1px solid #766143;color:#ffe0ad;font-size:13px}.empty{padding:25px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:15px}.list-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.list-row:first-of-type{border-top:0}.chart{width:100%;height:165px;display:block}.label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}.input{width:100%;background:#102122;color:white;border:1px solid #597368;border-radius:11px;padding:12px}.spaced{margin-top:12px}.hide{display:none}.tiny{font-size:11px;color:var(--muted)}.progress{height:9px;border-radius:9px;background:#2c4540;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:var(--green);transition:width .2s}.footer{text-align:center;color:#729088;font-size:11px;padding:25px 0}.link{color:var(--green);text-decoration:underline;cursor:pointer}.danger{color:#ffc2b9}@media(min-width:680px){.app{padding-top:15px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="logo">F</div><div><strong>FitStart <span style="color:var(--green)">2.0</span></strong><span class="tag">DEIN MUSKELAUFBAU-COACH</span></div></div><span class="pill" id="connection">Offline bereit</span></header><main id="main" aria-live="polite"></main><div class="footer">Privat · Ohne Account · Daten bleiben auf deinem Gerät</div></div><nav class="nav"><div class="nav-inner"><button data-nav="home"><span>⌂</span>Start</button><button data-nav="workout"><span>▣</span>Training</button><button data-nav="history"><span>▥</span>Verlauf</button><button data-nav="settings"><span>⚙</span>Daten</button></div></nav><input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
const KEY='fitstart.v2';
const EX={A:[['Beinpresse','Beine','8–12',8,12,2.5,'Füße hüftbreit; kontrolliert absenken.'],['Brustpresse','Brust / Trizeps','8–12',8,12,2.5,'Schultern entspannt, schmerzfreier Bewegungsradius.'],['Rudern sitzend','Rücken','10–12',10,12,2.5,'Ziehe die Ellenbogen nach hinten, ohne Schwung.'],['Beinbeuger','Beinrückseite','10–15',10,15,2.5,'Ruhig bewegen, nicht ins Hohlkreuz.'],['Seitheben','Schultern','12–15',12,15,1,'Nur schmerzfrei und mit leichtem Gewicht.'],['Dead Bug','Rumpf','8–10 / Seite',8,10,0,'Langsam und stabil; Gewicht = 0.']],B:[['Beinpresse (Alternative Fußposition)','Beine','8–12',8,12,2.5,'Bei Bedarf statt Kniebeugen; stabile Fußposition.'],['Latzug zur Brust','Rücken','8–12',8,12,2.5,'Nicht in den Nacken ziehen.'],['Schräg-Brustpresse','Brust','8–12',8,12,2.5,'Leicht geneigte Maschine, keine Schmerzen provozieren.'],['Glute Bridge','Gesäß','10–15',10,15,2.5,'Oben kurz halten, Rücken neutral.'],['Bizepscurls','Arme','10–15',10,15,1,'Oberarme ruhig lassen.'],['Pallof Press','Rumpf','10–12 / Seite',10,12,1,'Anti-Rotation; langsam, Gewicht optional.']]};
const seed=()=>({version:2,created:Date.now(),sessions:[],active:null,bodyweights:[],restSeconds:90});
let data;try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):seed();if(!Array.isArray(data.sessions)||!data.version)throw 0;}catch(e){data=seed();}
let page='home',timerEnds=0,timerInterval=null,toastText='';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=x=>new Date(x).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});
const week=()=>Math.floor((Date.now()-data.created)/604800000)+1;
const setCount=()=>week()<=2?2:3;
const currentType=()=>data.sessions.length%2===0?'A':'B';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Speichern nicht möglich. Bitte Speicherplatz bzw. Browser-Einstellungen prüfen und ein Backup erstellen.');return false}};
const latest=key=>{for(let i=data.sessions.length-1;i>=0;i--){const found=data.sessions[i].exercises.find(x=>x.key===key);if(found)return found}return null};
const keyFor=(type,i)=>type+'-'+i;
const recommendation=(key,min,max,increment)=>{const l=latest(key);if(!l)return 'Starte mit einem Gewicht, das 3–4 saubere Wiederholungen im Tank lässt.';const valid=l.sets.filter(s=>s.done&&s.reps>0);if(!valid.length)return 'Beim letzten Mal kein abgeschlossener Satz.';const w=Number(valid[0].kg)||0;if(valid.length===l.sets.length&&valid.every(s=>Number(s.reps)>=max)&&increment>0&&w>0)return 'Zuletzt '+w+' kg geschafft – probiere bei sauberer Technik ca. '+(Math.round((w+increment)*10)/10)+' kg.';return 'Zuletzt '+w+' kg – Gewicht halten, bis alle Sätze '+max+' Wiederholungen schaffen.'};
const countDone=()=>data.active?data.active.exercises.flatMap(e=>e.sets).filter(s=>s.done).length:0;
const countAll=()=>data.active?data.active.exercises.reduce((n,e)=>n+e.sets.length,0):0;
function startWorkout(){if(data.active){page='workout';render();return}let t=currentType();data.active={id:Date.now(),type:t,started:Date.now(),exercises:EX[t].map((ex,i)=>{let prev=latest(keyFor(t,i));let w=prev?.sets.find(s=>s.kg!==''&&s.kg!=null)?.kg??'';return {key:keyFor(t,i),name:ex[0],sets:Array.from({length:setCount()},()=>({kg:w,reps:'',done:false}))}})};save();page='workout';render()}
function home(){const done=data.sessions.length;return `<section class="hero"><div class="eyebrow">DEIN NÄCHSTER SCHRITT</div><h1>Stärker werden.<br>Training für Training.</h1><p>3 Einheiten pro Woche · Ganzkörper A/B · schrittweiser Aufbau</p><button class="btn wide spaced" data-act="${data.active?'resume':'start'}">${data.active?'Training fortsetzen →':'Training '+currentType()+' starten →'}</button></section><div class="stats"><div class="stat"><strong>${done}</strong><small>Einheiten</small></div><div class="stat"><strong>${week()}</strong><small>Trainingswoche</small></div><div class="stat"><strong>${setCount()}</strong><small>Sätze / Übung</small></div></div><h2>Deine Trainingswoche</h2><div class="card"><div class="between"><strong>Mo · Mi · Fr</strong><span class="pill">3 Tage</span></div><p class="tip">Einheiten wechseln: A – B – A, danach B – A – B. Verschieben ist okay; zwischen schweren Einheiten möglichst einen Ruhetag lassen.</p><div class="line"></div><div class="between"><div><h3>Nächste Einheit: ${currentType()}</h3><span class="muted">${EX[currentType()].length} Übungen · ca. 45–60 Minuten</span></div><button class="btn small secondary" data-nav="workout">Plan ansehen</button></div></div><h2>Dein Muskelaufbau-Fahrplan</h2><div class="card"><b>Woche 1–2 · Wieder reinkommen</b><p class="tip">2 Arbeitssätze pro Übung; 3–4 Wiederholungen vor Muskelversagen stoppen.</p><div class="line"></div><b>Ab Woche 3 · Progressiv trainieren</b><p class="tip">Bei guter Erholung 3 Sätze, mit 1–3 Wiederholungen Reserve. Erst Wiederholungen, dann Gewichte steigern.</p></div><div class="notice">Bei Schmerzen in Schulter, Nacken oder anderen Gelenken Übung stoppen und anpassen. Trotz aktueller Beschwerdefreiheit kontrolliert einsteigen.</div>`}
function preview(){let type=currentType();return `<section class="hero"><div class="eyebrow">BEREIT FÜR DEINE NÄCHSTE EINHEIT?</div><h1>Ganzkörper ${type}</h1><p>${EX[type].length} Übungen · ${setCount()} Sätze pro Übung · Trainingstage Mo / Mi / Fr</p><button class="btn wide spaced" data-act="start">Training ${type} starten</button></section><h2>Dein Plan</h2>${EX[type].map(e=>`<div class="card between"><div><b>${esc(e[0])}</b><div class="tip">${esc(e[1])}</div></div><span class="pill">${setCount()} × ${e[2]}</span></div>`).join('')}<div class="card"><b>Training ${type==='A'?'B':'A'} folgt danach</b><p class="tip">Die App wechselt automatisch zwischen beiden Ganzkörperplänen.</p></div>`}
function workout(){if(!data.active)return preview();const a=data.active,done=countDone(),total=countAll();return `<div class="between"><h2>Training ${a.type} <span class="muted" style="font-size:12px">${date(a.started)}</span></h2><button class="btn small warn" data-act="discard">Abbrechen</button></div><div class="card"><div class="between"><b>${done} von ${total} Sätzen erledigt</b><span class="pill">${Math.round(done/total*100)} %</span></div><div class="progress"><div style="width:${done/total*100}%"></div></div><span class="tip">Pause: ca. 90–120 s, bei schweren Beinsätzen auch länger. Gewicht in kg; für Körpergewichtsübungen 0 eintragen.</span></div><div id="timerSlot"></div>${a.exercises.map((ex,i)=>{let info=EX[a.type][i],rec=recommendation(ex.key,info[3],info[4],info[5]);return `<div class="card exercise"><div class="exercise-title"><div><h3>${i+1}. ${esc(ex.name)}</h3><small>${esc(info[1])} · ${esc(info[2])} Wdh.</small></div><span class="pill">${ex.sets.filter(s=>s.done).length}/${ex.sets.length}</span></div><p class="tip">${esc(info[6])}</p><p class="tip" style="color:var(--green)">${esc(rec)}</p><div class="set-head"><span>Satz</span><span>kg</span><span>Wdh.</span><span>Fertig</span></div>${ex.sets.map((s,j)=>`<div class="set-row"><span class="num">${j+1}</span><input class="field" type="number" inputmode="decimal" min="0" max="999" step="0.5" aria-label="${esc(ex.name)} Satz ${j+1} Gewicht" data-ex="${i}" data-set="${j}" data-field="kg" value="${esc(s.kg)}"><input class="field" type="number" inputmode="numeric" min="0" max="100" step="1" aria-label="${esc(ex.name)} Satz ${j+1} Wiederholungen" data-ex="${i}" data-set="${j}" data-field="reps" value="${esc(s.reps)}"><button class="check ${s.done?'on':''}" aria-label="Satz ${j+1} ${s.done?'als offen markieren':'abschließen'}" data-check="${i}-${j}">${s.done?'✓':'○'}</button></div>`).join('')}</div>`}).join('')}<button class="btn wide" data-act="finish">Training abschließen ✓</button><p class="tip spaced">Die Eingaben werden direkt auf deinem iPhone gespeichert. Zum Abschluss müssen mindestens ein Satz und dessen Wiederholungen erfasst sein.</p>`}
function graph(){const points=data.sessions.map(s=>({x:s.started,y:s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.done).reduce((k,v)=>k+(Number(v.kg)||0)*(Number(v.reps)||0),0),0)})).slice(-12);if(points.length<2)return `<div class="empty">Nach zwei absolvierten Einheiten erscheint hier dein Trainingsvolumen.</div>`;let max=Math.max(...points.map(x=>x.y),1),coords=points.map((p,i)=>`${18+i*(284/(points.length-1))},${142-p.y/max*118}`).join(' ');return `<svg class="chart" viewBox="0 0 320 165" role="img" aria-label="Trainingsvolumen der letzten ${points.length} Einheiten"><path d="M18 143H304" stroke="#547368" stroke-width="1"/><polyline points="${coords}" fill="none" stroke="#9cf5b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${points.map((p,i)=>`<circle cx="${18+i*284/(points.length-1)}" cy="${142-p.y/max*118}" r="4" fill="#9cf5b8"/>`).join('')}<text x="16" y="158" fill="#a3b9b2" font-size="10">älter</text><text x="272" y="158" fill="#a3b9b2" font-size="10">neuer</text></svg><p class="tiny">Summe Gewicht × Wiederholungen der abgeschlossenen Sätze (kg). Körpergewichtsübungen ohne eingetragenes Zusatzgewicht sind nicht enthalten. A- und B-Einheiten sind nur eingeschränkt vergleichbar.</p>`}
function history(){let total=data.sessions.length;return `<h2>Dein Fortschritt</h2><div class="stats"><div class="stat"><strong>${total}</strong><small>Workouts</small></div><div class="stat"><strong>${data.sessions.reduce((n,s)=>n+s.exercises.reduce((m,e)=>m+e.sets.filter(x=>x.done).length,0),0)}</strong><small>Sätze</small></div><div class="stat"><strong>${data.bodyweights.length?esc(data.bodyweights.at(-1).value):'–'}</strong><small>Körpergewicht kg</small></div></div><h2>Trainingsvolumen</h2><div class="card">${graph()}</div><h2>Körpergewicht</h2><div class="card"><div class="two"><div><label class="label" for="bw">Aktuelles Gewicht (kg)</label><input id="bw" class="input" type="number" inputmode="decimal" min="25" max="400" step="0.1" placeholder="z. B. 82,5"></div><div style="display:flex;align-items:end"><button class="btn wide" data-act="weight">Eintragen</button></div></div>${data.bodyweights.length?`<p class="tip">Letzter Eintrag: ${esc(data.bodyweights.at(-1).value)} kg am ${date(data.bodyweights.at(-1).at)}</p>`:''}</div><h2>Abgeschlossene Einheiten</h2>${total?data.sessions.slice().reverse().map((s,i)=>`<div class="card"><div class="between"><div><b>Training ${s.type} · ${date(s.started)}</b><div class="tip">${s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0)} Sätze · ${Math.max(1,Math.round((s.finished-s.started)/60000))} min</div></div><button class="btn small secondary" data-act="detail" data-id="${s.id}">Details</button></div></div>`).join(''):`<div class="empty">Dein erstes abgeschlossenes Training wird hier angezeigt.</div>`}`}
function detail(id){let s=data.sessions.find(s=>String(s.id)===String(id));if(!s)return;let str=s.exercises.map(e=>`${e.name}: ${e.sets.filter(x=>x.done).map(x=>`${x.kg||0} kg × ${x.reps}`).join(' | ')}`).join('\n');alert(`Training ${s.type} (${date(s.started)})\n\n${str}`)}
function settings(){return `<h2>Deine Daten</h2><div class="card"><h3>Privat und offline</h3><p class="tip">Alles bleibt lokal im Speicher dieser Web-App auf deinem iPhone. Es wird kein Trainingskonto erstellt und nichts an einen Server übertragen. iOS kann Website-Daten unter bestimmten Umständen entfernen; auch beim Gerätewechsel oder beim Löschen der App können Daten verloren gehen.</p><div class="line"></div><button class="btn wide" data-act="export">Backup als JSON-Datei sichern ↓</button><button class="btn wide secondary spaced" data-act="import">Backup wiederherstellen ↑</button><p class="tiny">Tipp: Speichere das Backup in der Dateien-App unter „Auf meinem iPhone“ oder in deinem gewünschten Backup-Speicher.</p></div><div class="card"><h3>Trainings-Einstellungen</h3><label class="label" for="rest">Pausentimer</label><select class="input" id="rest"><option value="60" ${data.restSeconds===60?'selected':''}>60 Sekunden</option><option value="90" ${data.restSeconds===90?'selected':''}>90 Sekunden</option><option value="120" ${data.restSeconds===120?'selected':''}>120 Sekunden</option><option value="180" ${data.restSeconds===180?'selected':''}>180 Sekunden</option></select><p class="tip">Aktuelle Einstiegsphase: Woche ${week()}; ${setCount()} Sätze pro Übung.</p></div><div class="card"><h3>Zum Home-Bildschirm</h3><p class="tip">Öffne die App in Safari unter ihrer HTTPS-Adresse. Tippe auf „Teilen“ → „Zum Home-Bildschirm“. Danach funktioniert sie nach dem ersten Laden auch offline.</p></div><div class="card"><button class="btn wide warn" data-act="reset">Alle lokalen Daten löschen</button><p class="tiny">Nur nach Sicherung empfohlen. Diese Aktion lässt sich nicht rückgängig machen.</p></div>`}
function render(){const m=$('#main');m.innerHTML=page==='home'?home():page==='workout'?workout():page==='history'?history():settings();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));showTimer();$('#connection').textContent=navigator.onLine?'Offlinefähig':'Offline';}
function showTimer(){let slot=$('#timerSlot');if(!slot)return;if(timerEnds<=Date.now()){slot.innerHTML='';return}let rem=Math.max(0,Math.ceil((timerEnds-Date.now())/1000)),fmt=`${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`;slot.innerHTML=`<div class="timer between"><div><div class="tiny">SATZPAUSE</div><strong>${fmt}</strong></div><div class="row"><button class="btn small secondary" data-act="plusTimer">+30 s</button><button class="btn small ghost" data-act="stopTimer">Beenden</button></div></div>`;}
function timerStart(){timerEnds=Date.now()+(data.restSeconds||90)*1000;showTimer();if(!timerInterval)timerInterval=setInterval(()=>{if(timerEnds&&timerEnds<=Date.now()){timerEnds=0;clearInterval(timerInterval);timerInterval=null;if(navigator.vibrate)navigator.vibrate([150,90,150])}showTimer()},1000)}
function finish(){let a=data.active;if(!a)return;let done=a.exercises.flatMap(e=>e.sets).filter(s=>s.done);if(!done.length){alert('Bitte mindestens einen Satz abhaken.');return}if(done.some(s=>!(Number(s.reps)>0))){alert('Bei abgehakten Sätzen bitte Wiederholungen eintragen.');return}if(!confirm('Training abschließen und dauerhaft im Verlauf speichern?'))return;data.sessions.push({...a,finished:Date.now()});data.active=null;timerEnds=0;save();page='history';render()}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fitstart-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){page=nav.dataset.nav;render();return}let check=e.target.closest('[data-check]');if(check&&data.active){let [i,j]=check.dataset.check.split('-').map(Number),s=data.active.exercises[i].sets[j];if(!s.done&&(!Number(s.reps)||Number(s.reps)<1)){alert('Bitte zuerst die Wiederholungen eingeben.');return}if(!s.done&&(s.kg===''||s.kg==null)){alert('Bitte Gewicht eintragen (für Körpergewicht 0).');return}s.done=!s.done;save();if(s.done)timerStart();render();return}let action=e.target.closest('[data-act]');if(!action)return;switch(action.dataset.act){case 'start':case 'resume':startWorkout();break;case 'finish':finish();break;case 'discard':if(confirm('Aktuelles Training wirklich verwerfen?')){data.active=null;timerEnds=0;save();page='home';render()}break;case 'stopTimer':timerEnds=0;showTimer();break;case 'plusTimer':timerEnds+=30000;showTimer();break;case 'detail':detail(action.dataset.id);break;case 'weight':{const v=Number($('#bw')?.value.replace(',','.'));if(v<25||v>400||!Number.isFinite(v)){alert('Bitte ein gültiges Körpergewicht in kg eingeben.');return}data.bodyweights.push({at:Date.now(),value:v});save();render();break}case 'export':exportData();break;case 'import':$('#importFile').click();break;case 'reset':if(confirm('Wirklich alle Trainingsdaten löschen? Das lässt sich nicht rückgängig machen.')&&confirm('Letzte Bestätigung: Alle FitStart-Daten entfernen?')){data=seed();save();page='home';render()}break;}}
);
document.addEventListener('change',e=>{let x=e.target;if(x.matches('[data-field]')&&data.active){let i=Number(x.dataset.ex),j=Number(x.dataset.set),f=x.dataset.field;let normalized=x.value.trim().replace(',','.');let v=normalized===''?'':Number(normalized);if(v!==''&&(!Number.isFinite(v)||v<0||(f==='kg'&&v>999)||(f==='reps'&&(v>100||!Number.isInteger(v))))){alert('Bitte einen gültigen Wert eingeben.');x.value='';v=''}data.active.exercises[i].sets[j][f]=v;save()}else if(x.id==='rest'){data.restSeconds=Number(x.value);save()}});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5_000_000)throw Error('Datei zu groß');let d=JSON.parse(await f.text());if(d.version!==2||!Array.isArray(d.sessions)||!Array.isArray(d.bodyweights)||typeof d.created!=='number')throw Error('Kein kompatibles FitStart-Backup');if(!confirm('Bestehende Daten durch das Backup ersetzen?'))return;data=d;save();page='home';render();alert('Backup wiederhergestellt.')}catch(err){alert('Import fehlgeschlagen: '+err.message)}finally{e.target.value=''}});
window.addEventListener('online',render);window.addEventListener('offline',render);
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
save();render();
</script></body></html>
